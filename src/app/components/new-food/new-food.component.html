<div class="modal-backdrop" (click)="close()">
    <div class="modal-content" (click)="$event.stopPropagation()">
        <h2>Új étel hozzáadása</h2>
        <form [formGroup]="edit" id="form">
            <label for="cat">Kategória</label>
            <select id="cat" formControlName="cat" (change)="typeChange($event)">
                <option value="0">- Kérlek válassz -</option>
                @for (foodtype of foodTypes; track $index){
                    <option value="{{foodtype.id}}">{{foodtype.name}}</option>
                }
            </select>
            <label for="name">Termék neve</label>
            <input type="text" id="name" formControlName="name">
            <label for="desc">Leírás</label>
            <textarea id="desc" formControlName="desc"></textarea>
            @if(!pizza){
                <label for="price">Ár</label>
                <input type="text" id="price" formControlName="price">
            }
            @if(pizza){
                <div id="pizzaprice">
                    <div>Ár</div>
                    <div>
                        <div>32cm</div>
                        <div>50cm</div>
                        <input type="text" formControlName="smallprice">
                        <input type="text" formControlName="bigprice">
                    </div>
                </div>
            }
            @if(soda){
                <div id="soda">
                    <label for="return">Visszaváltási díj</label>
                    <input type="checkbox" id="return" [checked]="sodaChacked" formControlName="isReturn">
                    <input type="number" step="50" min="50" value="50" formControlName="returnPrice">
                    <div>Ft</div>
                </div>
            }
        </form>
        <button (click)="save()">Hozzáadás</button>
        <button (click)="close()">Bezárás</button>
    </div>
</div>
