<div class="carousel">
    <div class="carousel-track"
        [style.transform]="'translateX(-' + currentIndex * 100 + '%)'"
        [style.transition]="isTransitioning ? 'transform 0.5s ease-in-out' : 'none'">
        @for (image of images; track image) {
            <div class="carousel-item">
                <img [src]="image" loading="lazy"/>
            </div>
        }
    </div>
    <button class="nav prev" (click)="prevSlide()">&#10094;</button>
    <button class="nav next" (click)="nextSlide()">&#10095;</button>
    <div class="dots">
        @for (img of images; let i = $index; track img) {
            <span
                [class.active]="i === currentIndex"
                (click)="goToSlide(i)">
            </span>
        }
    </div>
</div>
